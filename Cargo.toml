[workspace]
members = [
    "crates/xcelerate",
    "crates/xcelerate-core",
    "crates/xcelerate-plugin-api",
    "crates/xcelerate-plugins",
    "crates/xcelerate-bindgen",
]

# Keep non-Rust artifact directories out of the workspace so they are never
# treated as members (generated bindings, downloaded toolchains, generator
# inputs). Harmless with an explicit member list, but defensive if a Cargo.toml
# ever appears under one of them.
exclude = ["bindings", "tools", "adapters", "scripts"]
resolver = "3"

[workspace.package]
version = "1.0.9"
edition = "2024"
rust-version = "1.99.0"
authors = ["AzzoDude"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/AzzoDude/xcelerate"

# Shared lint policy for every crate in the workspace.
[workspace.lints.rust]
# `unsafe` is used deliberately in the first-party plugins crate for platform
# syscalls (setsid/pre_exec, libc::kill), so it is allowed rather than forbidden.
unsafe_code = "allow"

[workspace.lints.clippy]
# Allow lints that are not actionable for generated/hand-written glue.
empty_line_after_doc_comments = "allow"
doc_lazy_continuation = "allow"

# Every dependency version lives here so the whole workspace can be bumped to
# the latest release from a single place.
[workspace.dependencies]
# Internal crates.
xcelerate-core = { path = "crates/xcelerate-core", version = "1.0.9" }
xcelerate-plugin-api = { path = "crates/xcelerate-plugin-api", version = "1.0.9" }
xcelerate-plugins = { path = "crates/xcelerate-plugins", version = "1.0.9" }

# Third-party crates.
js-protocol = "0.1.6"
browser-protocol = "0.1.6"
# Held at the latest 0.31.x (0.31.2) on purpose: uniffi 0.32 changed its metadata
# encoding, and the third-party generators this workspace depends on for
# C#/Go/Dart/Node (`uniffi-bindgen-cs`, `-go`, `-dart`, `-node-js`) still vendor
# uniffi 0.31, so they cannot read a 0.32-built library. One cdylib carries one
# metadata version, so the whole workspace must stay in step. 0.31.x patch
# releases are still allowed; move to 0.32 only once every one of those
# generators ships 0.32 support (Dependabot is set to ignore >= 0.32).
uniffi = { version = "0.31.2", features = ["tokio"] }
futures = "0.3.34"
reqwest = { version = "0.13.5", features = ["json", "rustls"], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
thiserror = "2.0.21"
tempfile = "3.27.0"
base64 = "0.23.1"
once_cell = "1.21.4"
regex = "1.13.1"
libc = "0.2.190"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
