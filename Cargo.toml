[workspace]
members = [
    "crates/xcelerate",
    "crates/xcelerate-core",
    "crates/xcelerate-plugin-api",
    "crates/xcelerate-plugins",
    "crates/xcelerate-bindgen",
    "crates/xcelerate-cli",
    "crates/xcelerate-mcp",
    "plugins/stealth",
    "plugins/human",
]
exclude = ["bindings", "tools", "adapters", "scripts", "docs"]
resolver = "3"

[workspace.package]
version = "1.0.10"
edition = "2024"
rust-version = "1.99.0"
authors = ["AzzoDude"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/AzzoDude/xcelerate"

[workspace.lints.rust]
unsafe_code = "allow"

[workspace.lints.clippy]
empty_line_after_doc_comments = "allow"
doc_lazy_continuation = "allow"

[workspace.dependencies]
# Internal crates.
xcelerate = { path = "crates/xcelerate", version = "1.0.10" }
xcelerate-core = { path = "crates/xcelerate-core", version = "1.0.10" }
xcelerate-mcp = { path = "crates/xcelerate-mcp", version = "1.0.10" }
xcelerate-plugin-api = { path = "crates/xcelerate-plugin-api", version = "1.0.10" }
xcelerate-plugin-stealth = { path = "plugins/stealth", version = "1.0.10" }
xcelerate-plugin-human = { path = "plugins/human", version = "1.0.10" }
xcelerate-plugins = { path = "crates/xcelerate-plugins", version = "1.0.10" }

# External crates.
mimalloc = "0.1.52"
clap = { version = "4.5.20", features = ["derive"] }
js-protocol = "0.1.6"
browser-protocol = "0.1.6"
# Firefox / W3C WebDriver BiDi protocol bindings (published to crates.io).
webdriver-bidi = "0.1.0"
# Held at the latest 0.31.x (0.31.2) on purpose: uniffi 0.32 changed its metadata
# encoding, and the external generators this workspace depends on for
# C#/Go/Dart/Node (`uniffi-bindgen-cs`, `-go`, `-dart`, `-node-js`) still vendor
# uniffi 0.31, so they cannot read a 0.32-built library. One cdylib carries one
# metadata version, so the whole workspace must stay in step. 0.31.x patch
# releases are still allowed; move to 0.32 only once every one of those
# generators ships 0.32 support (Dependabot is set to ignore >= 0.32).
uniffi = { version = "0.31.2", features = ["tokio", "scaffolding-ffi-buffer-fns"] }
futures = "0.3.34"
reqwest = { version = "0.13.5", features = ["json", "rustls"], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
thiserror = "2.0.21"
tempfile = "3.27.0"
base64 = "0.23.1"
once_cell = "1.21.4"
regex = "1.13.1"
libc = "0.2.190"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
