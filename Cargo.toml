[workspace]
members = [
    "crates/xcelerate",
    "crates/xcelerate-core",
    "crates/xcelerate-plugin",
    "crates/xcelerate-bindgen",
    "crates/xcelerate-cli",
    "crates/xcelerate-mcp",
    "crates/xcelerate-codegen",
]
exclude = ["bindings", "tools", "adapters", "scripts", "docs"]
resolver = "3"

[workspace.package]
version = "1.0.13"
edition = "2024"
rust-version = "1.99.0"
authors = ["AzzoDude"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/AzzoDude/xcelerate"

[workspace.lints.rust]
unsafe_code = "allow"

[workspace.lints.clippy]
empty_line_after_doc_comments = "allow"
doc_lazy_continuation = "allow"

[workspace.dependencies]
# Internal crates.
xcelerate = { path = "crates/xcelerate", version = "1.0.13" }
xcelerate-core = { path = "crates/xcelerate-core", version = "1.0.13" }
xcelerate-mcp = { path = "crates/xcelerate-mcp", version = "1.0.13" }
xcelerate-codegen = { path = "crates/xcelerate-codegen", version = "1.0.13" }
xcelerate-plugin = { path = "crates/xcelerate-plugin", version = "1.0.13" }

# External crates.
mimalloc = "0.1.52"
clap = { version = "4.6.7", features = ["derive"] }
js-protocol = "0.1.6"
browser-protocol = "0.1.6"
# Firefox / W3C WebDriver BiDi protocol bindings (published to crates.io).
webdriver-bidi = "0.1.0"
# Held at the latest 0.31.x (0.31.2) on purpose: uniffi 0.32 changed its metadata
# encoding, and the external generators this workspace depends on for
# C#/Go/Dart/Node (`uniffi-bindgen-cs`, `-go`, `-dart`, `-node-js`) still vendor
# uniffi 0.31, so they cannot read a 0.32-built library. One cdylib carries one
# metadata version, so the whole workspace must stay in step. 0.31.x patch
# releases are still allowed; move to 0.32 only once every one of those
# generators ships 0.32 support (Dependabot is set to ignore >= 0.32).
uniffi = { version = "0.31.2", default-features = false, features = ["tokio", "scaffolding-ffi-buffer-fns"] }
futures = "0.3.34"
# Provides the rustls crypto provider for the rare user-supplied `wss://`
# endpoint. ring is a fraction of aws-lc-rs's size and build complexity; TLS is
# only ever used for remote debugging, never for the plaintext loopback CDP/BiDi
# traffic, so its handshake speed is not on the hot path.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Not `full`. Everything listed is needed by the CDP client, the CLIs, or
# wasmtime-wasi; only `signal` is dropped (nothing in the tree uses it).
# `parking_lot` is kept deliberately: it swaps tokio's internal locks for the
# faster ones, which is a runtime win not worth trading for the few KiB.
tokio = { version = "1.53.2", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "parking_lot",
    "process",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
thiserror = "2.0.21"
tempfile = "3.27.0"
base64 = "0.23.1"
libc = "0.2.190"

# In-process HTTPS client, used only by the CLI behind the optional `http`
# feature (fetch / download). Deliberately kept out of the core crate so the
# cdylib and every language binding stay dependency-light.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }

# The WASM plugin sandbox. Minimal feature sets: the loader only needs the
# component model compiled by Cranelift and driven synchronously, plus WASI
# preview-2 (see crates/xcelerate/src/plugin/wasm.rs). wasmtime's defaults also
# pull in the WAT text parser, the on-disk compile cache, wasm-GC proposals,
# runtime profiling, the pooling allocator, native debug info
# (addr2line/gimli/demangle), coredumps and parallel compilation - several MB
# this transport never uses.
wasmtime = { version = "49", default-features = false, features = [
    "async",
    "component-model",
    "cranelift",
    "runtime",
    "std",
] }
# `p2` is the only WASI surface the plugins target; the default `p1`/`p3` pull in
# the preview-1 wiggle shim and async-only interfaces.
wasmtime-wasi = { version = "49", default-features = false, features = ["p2"] }
rmp-serde = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
