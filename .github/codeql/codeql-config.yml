# CodeQL configuration for xcelerate.
#
# Only hand-written code is worth scanning. Everything under `bindings/` is
# generated by the UniFFI pipeline (and the Rust core is not a CodeQL language),
# so excluding it keeps the results focused and avoids scanning megabytes of
# generated FFI glue.

name: xcelerate CodeQL config

paths-ignore:
  - bindings/**
  - docs/**
  - "**/node_modules/**"
  - "**/*.min.js"
  - "**/*.min.css"

# Broader coverage than the default `security` suite. Comment this out to use
# the default suite if you prefer fewer, higher-confidence alerts.
queries:
  - uses: security-extended
