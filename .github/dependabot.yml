# Dependabot: version updates and security advisories for every ecosystem here.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    # Wait a week after a release before proposing it, so regressions are usually
    # caught upstream first (zizmor / Semgrep "cooldown" checks).
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # uniffi 0.32 changed its metadata encoding. The third-party generators
      # needed for C#/Go/Dart/Node still vendor uniffi 0.31 and cannot read a
      # 0.32-built cdylib, so the whole workspace is held at 0.31. Remove this
      # once all of uniffi-bindgen-cs / -go / -dart / -node-js support 0.32.
      - dependency-name: "uniffi"
        versions: [">= 0.32"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/bindings/javascript"
    schedule: { interval: weekly }
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: "/bindings/python"
    schedule: { interval: weekly }
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: "/bindings/go"
    schedule: { interval: weekly }
    cooldown:
      default-days: 7

  - package-ecosystem: gradle
    directory: "/bindings/java"
    schedule: { interval: weekly }
    cooldown:
      default-days: 7

  - package-ecosystem: gradle
    directory: "/bindings/kotlin"
    schedule: { interval: weekly }
    cooldown:
      default-days: 7

  - package-ecosystem: nuget
    directory: "/bindings/csharp"
    schedule: { interval: weekly }
    cooldown:
      default-days: 7
