# Rust lint results in GitHub code scanning.
#
# Rust is not a CodeQL language, so this is the only way `cargo clippy` findings
# appear in the Security -> Code scanning tab. It reports; it does not gate
# (ci.yml already runs clippy with `-D warnings`).

name: Clippy (SARIF)

on:
  push:
    branches: [main, master]
    paths: ['crates/**', 'Cargo.*', '.github/workflows/clippy-sarif.yml']
  pull_request:
    branches: [main, master]
    paths: ['crates/**', 'Cargo.*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install SARIF converters
        run: cargo install clippy-sarif sarif-fmt

      - name: Run clippy
        run: |
          cargo clippy --workspace --all-targets --all-features \
            --message-format=json | clippy-sarif | tee clippy.sarif | sarif-fmt

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: clippy.sarif
          category: clippy
