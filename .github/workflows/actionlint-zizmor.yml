# Lint and security-audit the GitHub Actions workflows themselves.

name: Workflow Lint

on:
  push:
    branches: [main, master]
    paths: ['.github/workflows/**', '.github/dependabot.yml']
  pull_request:
    branches: [main, master]
    paths: ['.github/workflows/**', '.github/dependabot.yml']

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 'stable'
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@latest
      - name: Run actionlint
        # actionlint (through v1.7.12) does not yet recognise GitHub's `$/`
        # self-repository syntax and reports it as a malformed reference even
        # though GitHub accepts it. Upstream fix: rhysd/actionlint#732 — drop
        # this ignore once a release supports `$/`.
        run: |
          "$(go env GOPATH)/bin/actionlint" -color \
            -ignore 'specifying action "\$/.+" in invalid format because ref is missing' \
            || true

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: pip install zizmor
      - name: Run zizmor
        run: zizmor --format sarif .github > zizmor.sarif || true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: zizmor.sarif
          category: zizmor
