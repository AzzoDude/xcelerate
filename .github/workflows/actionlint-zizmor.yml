# Lint and security-audit the GitHub Actions workflows themselves.

name: Workflow Lint

on:
  push:
    branches: [main, master]
    paths: ['.github/workflows/**', '.github/actions/**', '.github/requirements/**', '.github/dependabot.yml']
  pull_request:
    branches: [main, master]
    paths: ['.github/workflows/**', '.github/actions/**', '.github/requirements/**', '.github/dependabot.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
      # Pinned rather than @latest: installing an unpinned tool in CI is a
      # supply-chain risk (Scorecard Pinned-Dependencies). Bump deliberately.
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Run actionlint
        run: '"$(go env GOPATH)/bin/actionlint" -color || true'

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: pip install --require-hashes -r .github/requirements/zizmor.txt
      - name: Run zizmor
        run: zizmor --format sarif .github > zizmor.sarif || true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v3
        with:
          sarif_file: zizmor.sarif
          category: zizmor
