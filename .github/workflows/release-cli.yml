name: Release CLI

# Builds the `xcelerate` CLI for Windows/Linux/macOS on a `v*` tag and attaches
# the archives to the GitHub Release. The Windows zip is what the winget
# manifest points at (see packaging/winget/).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            kind: windows
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            kind: unix
          - os: macos-latest
            target: aarch64-apple-darwin
            kind: unix
          # Cross-compiled from the arm64 runner: the Apple SDK targets both.
          - os: macos-latest
            target: x86_64-apple-darwin
            kind: unix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: cli-${{ matrix.target }}

      - name: Build
        run: cargo build --release -p xcelerate-cli --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.kind == 'unix'
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          name="xcelerate-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/xcelerate" "dist/$name/"
          cp LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - name: Package (windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' |
            Select-Object -First 1).Matches.Groups[1].Value
          $name = "xcelerate-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/xcelerate.exe" "dist/$name/"
          Copy-Item LICENSE-MIT,LICENSE-APACHE "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Attach to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: (cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS)
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true

  winget:
    name: Submit to winget (optional)
    needs: release
    runs-on: windows-latest
    if: ${{ github.event_name == 'push' }}
    env:
      # Add a WINGET_TOKEN repo secret (a GitHub PAT with `public_repo`) to
      # auto-open the microsoft/winget-pkgs PR. Without it this job is a no-op.
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - if: env.WINGET_TOKEN == ''
        shell: pwsh
        run: echo "::warning::WINGET_TOKEN not set; skipping winget submission."
      - if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $url = "https://github.com/ChaoswareHQ/xcelerate/releases/download/v$version/xcelerate-$version-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update Chaosware.Xcelerate -v $version -u $url --submit --token $env:WINGET_TOKEN
