name: Build Core (Native Only)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['crates/**', 'Cargo.*', 'build.rs']

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build-native:
    name: Build Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: amd64
            target: x86_64-pc-windows-msvc
            lib_name: xcelerate.dll
          - os: windows-latest
            arch: arm64
            target: aarch64-pc-windows-msvc
            lib_name: xcelerate.dll
          - os: ubuntu-latest
            arch: amd64
            target: x86_64-unknown-linux-gnu
            lib_name: libxcelerate.so
          - os: ubuntu-latest
            arch: arm64
            target: aarch64-unknown-linux-gnu
            lib_name: libxcelerate.so
          - os: macos-latest
            arch: amd64
            target: x86_64-apple-darwin
            lib_name: libxcelerate.dylib
          - os: macos-latest
            arch: arm64
            target: aarch64-apple-darwin
            lib_name: libxcelerate.dylib
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Install Cross-Compilation Tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Core
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Upload Native Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-lib-${{ matrix.os }}-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/${{ matrix.lib_name }}
