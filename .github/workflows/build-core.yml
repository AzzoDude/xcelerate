name: Build Core (Native Only)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['crates/**', 'Cargo.*', 'build.rs']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build-native:
    name: Build Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: amd64
            target: x86_64-pc-windows-msvc
            lib_name: xcelerate.dll
          - os: windows-latest
            arch: arm64
            target: aarch64-pc-windows-msvc
            lib_name: xcelerate.dll
          - os: ubuntu-latest
            arch: amd64
            target: x86_64-unknown-linux-gnu
            lib_name: libxcelerate.so
          - os: ubuntu-latest
            arch: arm64
            target: aarch64-unknown-linux-gnu
            lib_name: libxcelerate.so
          - os: macos-latest
            arch: amd64
            target: x86_64-apple-darwin
            lib_name: libxcelerate.dylib
          - os: macos-latest
            arch: arm64
            target: aarch64-apple-darwin
            lib_name: libxcelerate.dylib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Install Cross-Compilation Tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Core
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Upload Native Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-lib-${{ matrix.os }}-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/${{ matrix.lib_name }}
