# Supply-chain checks for the Rust workspace.
#
#   * deny          - advisories + licenses + bans + sources (deny.toml). Gate.
#   * audit         - RustSec advisories (updates a tracking issue). Gate.
#   * semver-checks - detect API breaks against the published crate. Advisory.
#   * machete       - unused dependencies. Advisory.
#   * geiger        - count unsafe code (we allow `unsafe` for syscalls). Advisory.

name: Supply Chain

on:
  push:
    branches: [main, master]
    paths: ['crates/**', 'Cargo.*', 'deny.toml', '.github/workflows/supply-chain.yml']
  pull_request:
    branches: [main, master]
    paths: ['crates/**', 'Cargo.*', 'deny.toml']
  schedule:
    - cron: '15 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses bans sources
          arguments: --all-features

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  semver-checks:
    name: cargo-semver-checks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          package: xcelerate
          feature-group: all-features

  machete:
    name: cargo-machete
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@84ace1997b65ebd0730c4566c06af7075afc7c9f # cargo-machete
      - run: cargo machete

  geiger:
    name: cargo-geiger (unsafe)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - run: cargo install cargo-geiger
      - run: cargo geiger --all-features --output-format Markdown
