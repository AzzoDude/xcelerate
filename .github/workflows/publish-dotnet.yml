# Publish the .NET packages to NuGet.
#
# Run directly (Actions → Publish · .NET → Run workflow) or through the
# `publish.yml` dispatcher. Requires the `language-packages` artifact produced
# by the "Build Packages (Core + Bindings)" workflow.
name: "Publish · .NET"

on:
  workflow_call:
    inputs:
      run_id:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build Packages run ID (empty = latest successful run)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  nuget:
    name: NuGet
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/download-language-packages
        with:
          run_id: ${{ inputs.run_id }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NuGet
        run: |
          shopt -s nullglob
          packages=(dist-packages/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::warning::No NuGet packages (*.nupkg) found; skipping."
            exit 0
          fi
          if ! dotnet nuget push "${packages[@]}" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate; then
            echo "::warning::Could not publish NuGet package(s). Skipping."
          fi
