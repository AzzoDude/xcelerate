# Publish the npm package (Trusted Publishing / OIDC).
#
# Run directly (Actions → Publish · JavaScript → Run workflow) or through the
# `publish.yml` dispatcher. Requires the `language-packages` artifact produced
# by the "Build Packages (Core + Bindings)" workflow.
name: "Publish · JavaScript"

on:
  workflow_call:
    inputs:
      run_id:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build Packages run ID (empty = latest successful run)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  npm:
    name: npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC trusted publishing
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 'latest'
          registry-url: 'https://registry.npmjs.org'

      - uses: ./.github/actions/download-language-packages
        with:
          run_id: ${{ inputs.run_id }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        run: |
          cd dist-packages || { echo "::warning::dist-packages missing; skipping."; exit 0; }
          for f in *.tgz; do
            [ -f "$f" ] || continue
            NAME=$(tar -xOzf "$f" package/package.json | node -p "JSON.parse(fs.readFileSync(0)).name") || continue
            VERSION=$(tar -xOzf "$f" package/package.json | node -p "JSON.parse(fs.readFileSync(0)).version") || continue
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION already published. Skipping."; continue
            fi
            npm publish "$f" --access public || echo "::warning::Could not publish $NAME@$VERSION; skipping."
          done
