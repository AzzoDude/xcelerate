# OSSF Scorecard: supply-chain posture (branch protection, pinning, token
# permissions, dangerous workflows). Results publish to the OpenSSF API and
# upload to code scanning.

name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '20 7 * * 1'
  push:
    branches: [main, master]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        # Scorecard runs from a Docker image on gcr.io, which occasionally fails
        # to pull on hosted runners. The report is advisory, so tolerate that
        # rather than failing the check.
        continue-on-error: true
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results artifact
        if: always() && hashFiles('results.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF
        # Only when the analysis produced a file (a Docker pull flake leaves none).
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
          category: scorecard
