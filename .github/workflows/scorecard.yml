# OSSF Scorecard: supply-chain posture (branch protection, pinning, token
# permissions, dangerous workflows). Results publish to the OpenSSF API and
# upload to code scanning.

name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '20 7 * * 1'
  push:
    branches: [main, master]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run analysis
        # Scorecard runs from a Docker image on gcr.io, which occasionally fails
        # to pull on hosted runners. The report is advisory, so tolerate that
        # rather than failing the check.
        continue-on-error: true
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results artifact
        if: always() && hashFiles('results.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF
        # Only when the analysis produced a file (a Docker pull flake leaves none).
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: results.sarif
          category: scorecard
