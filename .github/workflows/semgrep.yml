# Semgrep: multi-language SAST, including Rust community rules (CodeQL has no
# Rust support). Generated bindings are excluded to avoid noise.

name: Semgrep

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - run: pip install semgrep

      - name: Scan
        run: |
          semgrep scan --config auto \
            --exclude bindings --exclude docs --exclude tools \
            --sarif --output semgrep.sarif --quiet || true

      - name: Drop suppressed findings from SARIF
        # Semgrep records `# nosemgrep` hits in SARIF as results that carry a
        # `suppressions` property. GitHub code scanning ignores that property
        # (it is not in GitHub's supported SARIF subset), so it would otherwise
        # open an alert for every suppressed finding. Strip them before upload.
        run: |
          if [ -s semgrep.sarif ]; then
            jq '.runs |= map(.results = [.results[]? | select((.suppressions // []) | length == 0)])' \
              semgrep.sarif > semgrep.filtered.sarif
            mv semgrep.filtered.sarif semgrep.sarif
          fi

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep
