# Publish the JVM bindings to Maven Central.
#
# The Java and Kotlin bindings are separate languages but share the same Gradle
# "publish to Maven Central" setup, so they are one matrix here rather than two
# near-identical workflows.
#
# Secrets (repository/environment):
#   CENTRAL_USERNAME / CENTRAL_PASSWORD  Sonatype Central Portal token
#   SIGNING_KEY / SIGNING_PASSWORD       ASCII-armoured PGP signing key
name: "Publish · Java / Kotlin"

on:
  workflow_call:
    inputs:
      run_id:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build Packages run ID (empty = latest successful run)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  maven-central:
    name: Maven Central (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [java, kotlin]
    env:
      # The Gradle build reads these exact (camelCase) environment variables.
      centralUsername: ${{ secrets.CENTRAL_USERNAME }}
      centralPassword: ${{ secrets.CENTRAL_PASSWORD }}
      signingKey: ${{ secrets.SIGNING_KEY }}
      signingPassword: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '22'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.12'

      - uses: ./.github/actions/download-language-packages
        with:
          run_id: ${{ inputs.run_id }}
          pattern: native-lib-*
          path: native-libs
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage the Gradle project
        run: |
          cp native-libs/*.dll native-libs/*.so native-libs/*.dylib "bindings/${{ matrix.language }}/"

      - name: Validate credentials
        id: creds
        run: |
          if [ -z "$centralUsername" ] || [ -z "$centralPassword" ]; then
            echo "::warning::CENTRAL_USERNAME/CENTRAL_PASSWORD not set; skipping Maven Central."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Maven Central
        if: steps.creds.outputs.ready == 'true'
        working-directory: bindings/${{ matrix.language }}
        run: gradle publish --no-daemon -x test
