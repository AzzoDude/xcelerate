# Publish the Dart/Flutter package to pub.dev, with the native core bundled.
#
# Why a custom workflow rather than the official `dart-lang/setup-dart`
# reusable workflow: the package ships prebuilt libraries for four platforms, so
# the libs have to be built and staged into the package before publishing, and
# the reusable workflow only publishes what is already in the tree.
#
# pub.dev automates publishing off a *tag push* (not a workflow filename): it
# only hands out a token to a run triggered by a tag matching the pattern
# configured in the package's Admin tab (`v{{version}}`), and that tag must equal
# `version:` in bindings/dart/pubspec.yaml.
#
# `environment` must match the environment required in the package's Admin tab.
# It travels inside the OIDC token, so protection rules on the GitHub
# environment (e.g. required reviewers) cannot be bypassed by editing this file.
#
# The libraries are staged, never committed: `bindings/dart/src/**` is
# un-ignored in .gitignore only so that `dart pub publish` can see them (pub
# drops any file that git ignores). Keeping them out of git history matters —
# they are ~20 MB each.
name: Publish to pub.dev

on:
  push:
    tags:
      # Must match the tag pattern configured on pub.dev (`v{{version}}`).
      - 'v[0-9]+.[0-9]+.[0-9]+*'

# A release in flight must not be cancelled by a later tag.
concurrency:
  group: publish-dart-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.token }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The macOS runners are arm64, and the Apple SDK also targets x86_64,
          # so one runner builds both darwin libraries (same as build-core.yml).
          - os: macos-latest
            target: aarch64-apple-darwin
            token: macos-arm64
            file: libxcelerate.dylib
          - os: macos-latest
            target: x86_64-apple-darwin
            token: macos-x64
            file: libxcelerate.dylib
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            token: linux-x64
            file: libxcelerate.so
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            token: windows-x64
            file: xcelerate.dll
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}

      # Deliberately no rust-cache here: these binaries are distributed to every
      # consumer, so they must not be built from cache state an untrusted run
      # could have poisoned (zizmor cache-poisoning). Releases are infrequent.

      - name: Build the native library
        run: cargo build --release -p xcelerate --target ${{ matrix.target }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dart-native-${{ matrix.token }}
          path: target/${{ matrix.target }}/release/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment required in the pub.dev Admin tab.
    environment: pub.dev
    permissions:
      contents: read
      id-token: write   # OIDC for pub.dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dart-native-*
          path: dart-native

      - name: Stage the prebuilt libraries into the package
        run: |
          for dir in dart-native/dart-native-*; do
            token=${dir#dart-native/dart-native-}
            mkdir -p "bindings/dart/src/$token"
            cp "$dir"/* "bindings/dart/src/$token/"
          done
          # Fail loudly if a platform did not make it, rather than shipping a
          # package that silently cannot load.
          for token in macos-arm64 macos-x64 linux-x64 windows-x64; do
            test -n "$(ls -A "bindings/dart/src/$token" 2>/dev/null)" \
              || { echo "::error::missing native library for $token"; exit 1; }
          done
          du -sh bindings/dart/src/*

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1

      - name: Validate the package
        working-directory: bindings/dart
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        working-directory: bindings/dart
        # setup-dart above configured the pub.dev OIDC token for this run.
        run: dart pub publish --force
