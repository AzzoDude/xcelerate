# Publish the Dart/Flutter package to pub.dev.
#
# The package is published from the committed sources in `bindings/dart`; the
# native core is resolved at build time by the consumer, so no artifact is
# needed here.
name: "Publish · Dart"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pub-dev:
    name: pub.dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1

      - name: Validate the package
        working-directory: bindings/dart
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        env:
          PUB_TOKEN: ${{ secrets.PUB_TOKEN }}
        run: |
          if [ -z "$PUB_TOKEN" ]; then
            echo "::warning::PUB_TOKEN not set; skipping pub.dev."
            exit 0
          fi
          # `dart pub publish` does not read PUB_TOKEN itself; register it first.
          dart pub token add https://pub.dev --env-var PUB_TOKEN
          cd bindings/dart
          dart pub publish --force || echo "::warning::pub.dev publish failed; skipping."
