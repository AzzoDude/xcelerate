name: Publish Only (From Existing Artifacts)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of the "Build Packages" workflow to publish from'
        required: false
        default: ''

jobs:
  publish:
    name: Publish to Registries
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Workspace Version
        id: version
        run: echo "version=$(grep -oP '^version = \"\K[^\"]+' Cargo.toml | head -n 1)" >> $GITHUB_OUTPUT

      - name: Find Latest Build Run ID
        id: find-run
        run: |
          if [ "${{ github.event.inputs.run_id }}" != "" ]; then
            echo "run_id=${{ github.event.inputs.run_id }}" >> $GITHUB_OUTPUT
          else
            RUN_ID=$(gh run list --workflow "Build Packages (Core + Bindings)" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            if [ -z "$RUN_ID" ]; then
              echo "Error: No successful 'Build Packages' runs found."
              exit 1
            fi
            echo "Found latest successful run: $RUN_ID"
            echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: language-packages
          path: dist-packages
          run-id: ${{ steps.find-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        # Authenticates with npm Trusted Publishing (OIDC) — no long-lived
        # NPM_TOKEN required. Requires a "Trusted Publisher" entry for the
        # `xcelerate` package on npmjs.com pointing at this repo and the
        # `publish-only.yml` workflow filename, with "npm publish" allowed.
        # See https://docs.npmjs.com/trusted-publishers
        #
        # Best-effort: if auth is missing or this package can't be published,
        # emit a warning and continue so the other registries still run.
        run: |
          if ! cd dist-packages; then
            echo "::warning::dist-packages directory not found; skipping npm publish."
            exit 0
          fi
          for f in *.tgz; do
            [ -f "$f" ] || continue

            echo "Extracting metadata from $f..."
            if ! PACKAGE_JSON=$(tar -xOzf "$f" package/package.json); then
              echo "::warning::Could not read package.json from $f; skipping."
              continue
            fi
            if ! PACKAGE_NAME=$(echo "$PACKAGE_JSON" | node -p "JSON.parse(fs.readFileSync(0)).name"); then
              echo "::warning::Could not parse package name from $f; skipping."
              continue
            fi
            if ! PACKAGE_VERSION=$(echo "$PACKAGE_JSON" | node -p "JSON.parse(fs.readFileSync(0)).version"); then
              echo "::warning::Could not parse package version from $f; skipping."
              continue
            fi

            if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
              echo "Version $PACKAGE_VERSION of $PACKAGE_NAME already exists. Skipping."
              continue
            fi

            echo "Publishing $f to npm..."
            if npm publish "$f" --access public; then
              echo "Published $PACKAGE_NAME@$PACKAGE_VERSION to npm."
            else
              echo "::warning::Could not publish $PACKAGE_NAME@$PACKAGE_VERSION to npm (missing/invalid auth or insufficient permission). Skipping; continuing with remaining registries."
            fi
          done

      - name: Prepare PyPI Artifacts
        id: pypi-prep
        run: |
          mkdir -p dist-pypi
          cp dist-packages/*.whl dist-pypi/ 2>/dev/null || true
          cp dist-packages/*.tar.gz dist-pypi/ 2>/dev/null || true
          if [ -n "$(ls -A dist-pypi)" ]; then
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
            echo "PyPI artifacts found."
          else
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
            echo "No PyPI artifacts found."
          fi

      - name: Publish to PyPI
        if: steps.pypi-prep.outputs.has_artifacts == 'true'
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-pypi/
          skip-existing: true

      - name: Publish to NuGet
        # Best-effort: warn and skip if there's nothing to push or auth fails.
        run: |
          shopt -s nullglob
          packages=(dist-packages/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::warning::No NuGet packages (*.nupkg) found; skipping."
            exit 0
          fi
          if ! dotnet nuget push "${packages[@]}" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate; then
            echo "::warning::Could not publish NuGet package(s) (missing/invalid API key or insufficient permission). Skipping."
          fi

      - name: Publish to crates.io
        # Best-effort: warn and skip a crate if it can't be published.
        run: |
          CRATE_VERSION=$(grep -oP '^version = "\K[^"]+' Cargo.toml | head -n 1)

          # Publish in dependency order: facade <- plugins <- plugin-api <- core.
          for CRATE in xcelerate-core xcelerate-plugin-api xcelerate-plugins xcelerate; do
            if cargo search "$CRATE" --limit 1 | grep -q "\"$CRATE_VERSION\""; then
              echo "$CRATE $CRATE_VERSION already published. Skipping."
              continue
            fi

            published=false
            for attempt in 1 2 3; do
              echo "Attempt $attempt: publishing $CRATE $CRATE_VERSION..."
              if cargo publish -p "$CRATE" --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --allow-dirty; then
                published=true
                break
              fi
              echo "crates.io error, retrying in 15s..."
              sleep 15
            done
            if [ "$published" != "true" ]; then
              echo "::warning::Could not publish $CRATE $CRATE_VERSION to crates.io after 3 attempts (missing/invalid token or insufficient permission). Skipping."
              continue
            fi

            # Wait for the crate to appear in the index before the next one.
            for i in $(seq 1 30); do
              if cargo search "$CRATE" --limit 1 | grep -q "\"$CRATE_VERSION\""; then break; fi
              sleep 5
            done
          done

      - name: Publish to RubyGems
        # Best-effort: skip cleanly when the key is absent or the push fails.
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          if [ -z "$GEM_HOST_API_KEY" ]; then
            echo "::warning::RUBYGEMS_API_KEY not set; skipping RubyGems."
            exit 0
          fi
          cd bindings/ruby
          gem build xcelerate.gemspec
          gem push xcelerate-*.gem || echo "::warning::RubyGems push failed; skipping."

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Publish to pub.dev
        env:
          PUB_TOKEN: ${{ secrets.PUB_TOKEN }}
        run: |
          if [ -z "$PUB_TOKEN" ]; then
            echo "::warning::PUB_TOKEN not set; skipping pub.dev."
            exit 0
          fi
          cd bindings/dart
          dart pub publish --force || echo "::warning::pub.dev publish failed; skipping."

      - name: Tag Go Module
        # Go modules are served from git tags: bindings/go/vX.Y.Z.
        run: |
          TAG="bindings/go/v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "xcelerate Go bindings v${{ steps.version.outputs.version }}"
          git push origin "$TAG" || echo "::warning::Could not push $TAG; skipping."

      # SwiftPM publishes via a dedicated repository (Package.swift at its root).
      # Add a step that runs `python scripts/publish_swift.py --push --remote <repo>`
      # once such a repository and a push token are configured.

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          files: dist-packages/*
