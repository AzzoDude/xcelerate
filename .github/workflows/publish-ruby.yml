# Publish the Ruby gem to RubyGems.
#
# The gem bundles the native core (`*.dll/*.so/*.dylib`) at the binding root, so
# the native libraries are downloaded and staged before the gem is built.
name: "Publish · Ruby"

on:
  workflow_call:
    inputs:
      run_id:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build Packages run ID (empty = latest successful run)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  rubygems:
    name: RubyGems
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/download-language-packages
        with:
          run_id: ${{ inputs.run_id }}
          pattern: native-lib-*
          path: native-libs
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage the gem
        run: |
          cp native-libs/*.dll native-libs/*.so native-libs/*.dylib bindings/ruby/
          cd bindings/ruby
          gem build xcelerate.gemspec

      - name: Publish to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          if [ -z "$GEM_HOST_API_KEY" ]; then
            echo "::warning::RUBYGEMS_API_KEY not set; skipping RubyGems."
            exit 0
          fi
          cd bindings/ruby
          gem push xcelerate-*.gem || echo "::warning::RubyGems push failed; skipping."
