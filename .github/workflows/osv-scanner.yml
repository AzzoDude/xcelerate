# OSV-Scanner: vulnerabilities across every lockfile in the repo
# (Cargo, npm, pip/pyproject, Go, Gradle, NuGet, gems, pub).
#
# Runs the scanner directly so it does not depend on a versioned action ref.

name: OSV Scanner

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '40 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  osv-scan:
    name: Scan dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: Install osv-scanner
        # Pinned rather than @latest: an unpinned install in CI is a supply-chain
        # risk (Scorecard Pinned-Dependencies). Pinning also means new OSV
        # detections only arrive when this is bumped deliberately.
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0

      - name: Scan
        run: |
          "$(go env GOPATH)/bin/osv-scanner" scan source -r . \
            --format sarif --output osv.sarif || true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v3
        with:
          sarif_file: osv.sarif
          category: osv
