# OSV-Scanner: vulnerabilities across every lockfile in the repo
# (Cargo, npm, pip/pyproject, Go, Gradle, NuGet, gems, pub).
#
# Runs the scanner directly so it does not depend on a versioned action ref.

name: OSV Scanner

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '40 4 * * 1'

permissions:
  contents: read

jobs:
  osv-scan:
    name: Scan dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 'stable'

      - name: Install osv-scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest

      - name: Scan
        run: |
          "$(go env GOPATH)/bin/osv-scanner" scan source -r . \
            --format sarif --output osv.sarif || true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: osv.sarif
          category: osv
