# Publish every Xcelerate registry package.
#
# Two trigger paths, one file:
#   * `workflow_dispatch` publishes the artifact-producing registries below
#     (crates.io, PyPI, npm, NuGet, Maven, RubyGems, PowerShell, SwiftPM, and the
#     GitHub Release). Select `only` to publish a single registry.
#   * a `vX.Y.Z` tag push publishes Dart/Flutter to pub.dev, and nothing else.
#     pub.dev only issues a token to a run GitHub triggered by a matching tag, so
#     the Dart job is gated on the push event; every dispatch-gated job skips.
#
# This is intentionally ONE workflow with one job per registry, rather than a
# per-language workflow fanned out by a dispatcher. OIDC-based registries
# (crates.io, PyPI, npm) match the trusted-publisher config against the
# `workflow_ref` claim, which GitHub sets to the *caller* workflow. A reusable
# workflow would therefore appear to those registries as `publish.yml` while a
# direct dispatch would appear as `publish-rust.yml`, forcing every registry to
# register two filenames. Keeping everything in this one file means each
# registry needs exactly one trusted-publisher entry: `publish.yml`.
#
# Run it from Actions → Publish → Run workflow. Set `only` to publish a single
# registry (handy for re-publishing after a partial failure); leave it on `all`
# to fan out to everything. Artifact-producing jobs pull the `language-packages`
# and `native-lib-*` artifacts from the "Build Packages (Core + Bindings)"
# workflow — run that first, or let this resolve the latest successful run.
#
# Secrets (crates.io and pub.dev need none — both use OIDC):
#   NUGET_API_KEY          NuGet
#   CENTRAL_USERNAME       Maven Central (Sonatype Portal token user)
#   CENTRAL_PASSWORD       Maven Central (Sonatype Portal token password)
#   SIGNING_KEY            Maven Central PGP signing key (ASCII-armoured)
#   SIGNING_PASSWORD       Maven Central PGP key passphrase
#   RUBYGEMS_API_KEY       RubyGems
#   PSGALLERY_API_KEY      PowerShell Gallery
#   SWIFT_REMOTE_URL       SwiftPM repository git URL with an embedded token
# npm and PyPI use Trusted Publishing (OIDC) and need no long-lived token.
#
# The in-repo composite action is referenced as `./...`, not zizmor's preferred
# `$/...`. GitHub accepts `$/` (since 2026-07-30), but Semgrep's
# github-actions-mutable-action-tag rule and Scorecard's Pinned-Dependencies
# check both mis-read it as an unpinned action. Trading six informational zizmor
# notes for six Semgrep warnings plus six Scorecard mediums is a bad deal, so
# use `./` and silence the zizmor note inline. Revisit when both tools parse `$/`.
name: Publish

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build Packages run ID to publish from (empty = latest successful run)'
        required: false
        default: ''
      only:
        description: 'Publish only this registry (default: all)'
        type: choice
        required: false
        default: all
        options:
          - all
          - rust
          - python
          - javascript
          - dotnet
          - java
          - ruby
          - go
          - powershell
          - swift
          - release
          # Dart/Flutter is absent here on purpose: pub.dev only publishes a run
          # that GitHub triggered by a tag, so it cannot go through a dispatch.

  push:
    tags:
      # Must match the tag pattern configured on pub.dev (`v{{version}}`).
      - 'v[0-9]+.[0-9]+.[0-9]+*'

# Serialize publishes: two runs touching the same version would race on the
# registries, so never cancel one in progress.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # --- Rust → crates.io (Trusted Publishing) ----------------
  rust:
    name: crates.io
    if: ${{ inputs.only == 'all' || inputs.only == 'rust' }}
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Authenticate with crates.io (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crates (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          VERSION=$(grep -oP '^version = "\K[^"]+' Cargo.toml | head -n 1)
          for CRATE in xcelerate-core xcelerate-plugin-api xcelerate-plugin-stealth xcelerate-plugin-human xcelerate-plugins xcelerate; do
            if cargo search "$CRATE" --limit 1 | grep -q "\"$VERSION\""; then
              echo "$CRATE $VERSION already published. Skipping."
              continue
            fi
            published=false
            for attempt in 1 2 3; do
              echo "Attempt $attempt: publishing $CRATE $VERSION..."
              if cargo publish -p "$CRATE" --allow-dirty; then
                published=true
                break
              fi
              sleep 15
            done
            if [ "$published" != "true" ]; then
              echo "::warning::Could not publish $CRATE $VERSION to crates.io. Skipping."
              continue
            fi
            for i in $(seq 1 30); do
              if cargo search "$CRATE" --limit 1 | grep -q "\"$VERSION\""; then break; fi
              sleep 5
            done
          done

  # --- Python → PyPI (Trusted Publishing / OIDC) ----------------------------
  python:
    name: PyPI
    if: ${{ inputs.only == 'all' || inputs.only == 'python' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC trusted publishing
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/download-language-packages # zizmor: ignore[self-repository]
        with:
          run_id: ${{ inputs.run_id }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect PyPI artifacts
        id: prep
        run: |
          mkdir -p dist-pypi
          cp dist-packages/*.whl dist-pypi/ 2>/dev/null || true
          cp dist-packages/*.tar.gz dist-pypi/ 2>/dev/null || true
          if [ -n "$(ls -A dist-pypi)" ]; then
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
          else
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to PyPI
        if: steps.prep.outputs.has_artifacts == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist-pypi/
          skip-existing: true

  # --- JavaScript → npm (Trusted Publishing / OIDC) -------------------------
  javascript:
    name: npm
    if: ${{ inputs.only == 'all' || inputs.only == 'javascript' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC trusted publishing
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 'latest'
          registry-url: 'https://registry.npmjs.org'
          # No package-manager cache: this workflow publishes artifacts, so it
          # must not source them from cache state a `push` run could poison.
          package-manager-cache: false

      - uses: ./.github/actions/download-language-packages # zizmor: ignore[self-repository]
        with:
          run_id: ${{ inputs.run_id }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        run: |
          cd dist-packages || { echo "::warning::dist-packages missing; skipping."; exit 0; }
          for f in *.tgz; do
            [ -f "$f" ] || continue
            NAME=$(tar -xOzf "$f" package/package.json | node -p "JSON.parse(fs.readFileSync(0)).name") || continue
            VERSION=$(tar -xOzf "$f" package/package.json | node -p "JSON.parse(fs.readFileSync(0)).version") || continue
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION already published. Skipping."; continue
            fi
            npm publish "$f" --access public || echo "::warning::Could not publish $NAME@$VERSION; skipping."
          done

  # --- .NET → NuGet ---------------------------------------------------------
  dotnet:
    name: NuGet
    if: ${{ inputs.only == 'all' || inputs.only == 'dotnet' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/download-language-packages # zizmor: ignore[self-repository]
        with:
          run_id: ${{ inputs.run_id }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NuGet
        run: |
          shopt -s nullglob
          packages=(dist-packages/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::warning::No NuGet packages (*.nupkg) found; skipping."
            exit 0
          fi
          if ! dotnet nuget push "${packages[@]}" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate; then
            echo "::warning::Could not publish NuGet package(s). Skipping."
          fi

  # --- Java + Kotlin → Maven Central ---------------------------------------
  # Two languages, one Gradle "publish to Maven Central" setup, so a matrix.
  java:
    name: Maven Central (${{ matrix.language }})
    if: ${{ inputs.only == 'all' || inputs.only == 'java' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java
            artifact: xcelerate-java
          - language: kotlin
            artifact: xcelerate
    env:
      # The Gradle build reads these exact (camelCase) environment variables.
      centralUsername: ${{ secrets.CENTRAL_USERNAME }}
      centralPassword: ${{ secrets.CENTRAL_PASSWORD }}
      signingKey: ${{ secrets.SIGNING_KEY }}
      signingPassword: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '22'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.12'
          # No dependency cache: publishing runs must not trust cache state.
          cache-disabled: true

      - uses: ./.github/actions/download-language-packages # zizmor: ignore[self-repository]
        with:
          run_id: ${{ inputs.run_id }}
          pattern: native-lib-*
          path: native-libs
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage the Gradle project
        run: |
          cp native-libs/*.dll native-libs/*.so native-libs/*.dylib "bindings/${{ matrix.language }}/"

      - name: Validate credentials
        id: creds
        run: |
          if [ -z "$centralUsername" ] || [ -z "$centralPassword" ]; then
            echo "::warning::CENTRAL_USERNAME/CENTRAL_PASSWORD not set; skipping Maven Central."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether this version is already on Maven Central
        id: exists
        run: |
          VERSION=$(grep -oP '^version = "\K[^"]+' Cargo.toml | head -n 1)
          QUERY="https://search.maven.org/solrsearch/select?q=g:%22io.github.azzodude%22%20AND%20a:%22${{ matrix.artifact }}%22%20AND%20v:%22${VERSION}%22&rows=1&wt=json"
          # Fail open: if the lookup itself fails, attempt the publish anyway.
          FOUND=$(curl -fsS "$QUERY" | grep -oP '"numFound":\K[0-9]+' || echo 0)
          if [ "${FOUND:-0}" != "0" ]; then
            echo "::notice::${{ matrix.artifact }} ${VERSION} is already on Maven Central; skipping."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Maven Central
        # Central rejects a version that already exists, which would fail this
        # job even though the other registries may still need publishing.
        if: ${{ steps.creds.outputs.ready == 'true' && steps.exists.outputs.published != 'true' }}
        working-directory: bindings/${{ matrix.language }}
        run: gradle publish --no-daemon -x test

  # --- Ruby → RubyGems ------------------------------------------------------
  ruby:
    name: RubyGems
    if: ${{ inputs.only == 'all' || inputs.only == 'ruby' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/download-language-packages # zizmor: ignore[self-repository]
        with:
          run_id: ${{ inputs.run_id }}
          pattern: native-lib-*
          path: native-libs
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage the gem
        run: |
          cp native-libs/*.dll native-libs/*.so native-libs/*.dylib bindings/ruby/
          cd bindings/ruby
          gem build xcelerate.gemspec

      - name: Publish to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          if [ -z "$GEM_HOST_API_KEY" ]; then
            echo "::warning::RUBYGEMS_API_KEY not set; skipping RubyGems."
            exit 0
          fi
          cd bindings/ruby
          gem push xcelerate-*.gem || echo "::warning::RubyGems push failed; skipping."

  # --- Go → module tag ------------------------------------------------------
  go:
    name: Go module tag
    if: ${{ inputs.only == 'all' || inputs.only == 'go' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pushing the module tag
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 'stable'
          # No module cache: publishing runs must not trust cache state.
          cache: false

      - name: Validate the module
        working-directory: bindings/go
        run: |
          go mod tidy
          go build ./...
          go vet ./...

      - name: Tag the module
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP '^version = "\K[^"]+' Cargo.toml | head -n 1)
          TAG="bindings/go/v${VERSION}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "xcelerate Go bindings v${VERSION}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TAG"
          echo "Pushed $TAG; pkg.go.dev will index it shortly."

  # --- PowerShell → PowerShell Gallery -------------------------------------
  powershell:
    name: PowerShell Gallery
    if: ${{ inputs.only == 'all' || inputs.only == 'powershell' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Publish to the PowerShell Gallery
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
          PSGALLERY_REPOSITORY: PSGallery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrEmpty($env:PSGALLERY_API_KEY)) {
            Write-Warning 'PSGALLERY_API_KEY not set; skipping the PowerShell Gallery.'
            exit 0
          }
          $module = 'bindings/powershell'
          # A gallery rejects a version that already exists. Treat that as a
          # no-op so the rest of the registries can still be published, but let
          # any other failure surface.
          try {
            if (Get-Command Publish-PSResource -ErrorAction SilentlyContinue) {
              Publish-PSResource -Path $module -Repository $env:PSGALLERY_REPOSITORY -ApiKey $env:PSGALLERY_API_KEY
            } else {
              Publish-Module -Path $module -Repository $env:PSGALLERY_REPOSITORY -NuGetApiKey $env:PSGALLERY_API_KEY
            }
          } catch {
            if ($_.Exception.Message -match 'already exists|already been published|is already|Cannot publish') {
              Write-Warning "Xcelerate is already at this version on $($env:PSGALLERY_REPOSITORY); skipping."
              exit 0
            }
            throw
          }

  # --- Swift → SwiftPM repository ------------------------------------------
  swift:
    name: SwiftPM repository
    if: ${{ inputs.only == 'all' || inputs.only == 'swift' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Tag and push the SwiftPM repository
        env:
          SWIFT_REMOTE_URL: ${{ secrets.SWIFT_REMOTE_URL }}
        run: |
          VERSION=$(grep -oP '^version = "\K[^"]+' Cargo.toml | head -n 1)
          if [ -z "$SWIFT_REMOTE_URL" ]; then
            echo "::warning::SWIFT_REMOTE_URL not set; skipping the SwiftPM push."
            exit 0
          fi
          git subtree split -P bindings/swift -b swift-release
          git remote add swift "$SWIFT_REMOTE_URL"
          git push --force swift swift-release:main
          git tag -a "$VERSION" -m "xcelerate Swift SDK $VERSION" || true
          git push swift "$VERSION" || echo "::warning::Could not push tag $VERSION; skipping."

  # --- Dart/Flutter → pub.dev (Trusted Publishing) --------------------------
  #
  # Tag-triggered only: pub.dev rejects any run not triggered by a matching tag,
  # so these jobs run on the `push` event and never on `workflow_dispatch`. The
  # native libraries are built here rather than reused from build-packages.yml
  # because a tag run has no such artifacts, and the bundled set needs macOS x64
  # as well as arm64.
  dart-native:
    name: Dart native (${{ matrix.token }})
    if: ${{ github.event_name == 'push' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The macOS runners are arm64 and the Apple SDK also targets x86_64, so
          # one runner builds both darwin libraries (same as build-core.yml).
          - os: macos-latest
            target: aarch64-apple-darwin
            token: macos-arm64
            file: libxcelerate.dylib
          - os: macos-latest
            target: x86_64-apple-darwin
            token: macos-x64
            file: libxcelerate.dylib
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            token: linux-x64
            file: libxcelerate.so
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            token: windows-x64
            file: xcelerate.dll
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}

      # Deliberately no rust-cache here: these binaries are distributed to every
      # consumer, so they must not be built from cache state an untrusted run
      # could have poisoned (zizmor cache-poisoning). Releases are infrequent.

      - name: Build the native library
        run: cargo build --release -p xcelerate --target ${{ matrix.target }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dart-native-${{ matrix.token }}
          path: target/${{ matrix.target }}/release/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 1

  dart:
    name: pub.dev
    if: ${{ github.event_name == 'push' }}
    needs: dart-native
    runs-on: ubuntu-latest
    # Must match the environment required in the package's Admin tab on pub.dev.
    environment: pub.dev
    permissions:
      contents: read
      id-token: write   # OIDC for pub.dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dart-native-*
          path: dart-native

      - name: Stage the prebuilt libraries into the package
        run: |
          for dir in dart-native/dart-native-*; do
            token=${dir#dart-native/dart-native-}
            mkdir -p "bindings/dart/src/$token"
            cp "$dir"/* "bindings/dart/src/$token/"
          done
          # Fail loudly if a platform did not make it, rather than shipping a
          # package that silently cannot load.
          for token in macos-arm64 macos-x64 linux-x64 windows-x64; do
            test -n "$(ls -A "bindings/dart/src/$token" 2>/dev/null)" \
              || { echo "::error::missing native library for $token"; exit 1; }
          done
          du -sh bindings/dart/src/*

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1

      - name: Verify the tag matches the package version
        # pub.dev only publishes a run whose tag equals `version:` in
        # pubspec.yaml, so fail here with a clear message rather than letting the
        # upload get rejected.
        working-directory: bindings/dart
        env:
          # Passed via the environment, not interpolated into the script: a tag
          # is attacker-influenced text (Semgrep run-shell-injection).
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml | head -n1 | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "::error::could not read version from bindings/dart/pubspec.yaml"
            exit 1
          fi
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match bindings/dart/pubspec.yaml v$version"
            exit 1
          fi
          echo "Publishing tag $TAG (pubspec version $version)"

      - name: Validate the package
        working-directory: bindings/dart
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        working-directory: bindings/dart
        # setup-dart above configured the pub.dev OIDC token for this run.
        run: dart pub publish --force

  # --- GitHub Release -------------------------------------------------------
  release:
    name: GitHub Release
    if: ${{ inputs.only == 'all' || inputs.only == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read workspace version
        id: version
        run: echo "version=$(grep -oP '^version = \"\K[^\"]+' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/download-language-packages # zizmor: ignore[self-repository]
        with:
          run_id: ${{ inputs.run_id }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --generate-notes --title "$TAG"
          gh release upload "$TAG" dist-packages/* --clobber
