# Static checks for the hand-written Python tooling (scripts/ and
# adapters/runtime.py). Generated bindings are not scanned.

name: Python Quality

on:
  push:
    branches: [main, master]
    paths: ['scripts/**', 'adapters/**', 'plugins/**/*.py', '.github/requirements/python-quality.txt', '.github/workflows/python-quality.yml']
  pull_request:
    branches: [main, master]
    paths: ['scripts/**', 'adapters/**', 'plugins/**/*.py', '.github/requirements/python-quality.txt']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff + bandit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - run: pip install --require-hashes -r .github/requirements/python-quality.txt

      - name: ruff (lint)
        continue-on-error: true
        run: ruff check scripts adapters

      - name: ruff (format)
        continue-on-error: true
        run: ruff format --check scripts adapters

      - name: bandit (SARIF)
        continue-on-error: true
        run: bandit -r scripts adapters -f sarif -o bandit.sarif -ll

      - name: Upload SARIF
        if: ${{ hashFiles('bandit.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v3
        with:
          sarif_file: bandit.sarif
          category: bandit
