# Static checks for the hand-written Python tooling (scripts/ and
# adapters/runtime.py). Generated bindings are not scanned.

name: Python Quality

on:
  push:
    branches: [main, master]
    paths: ['scripts/**', 'adapters/**', 'plugins/**/*.py', '.github/workflows/python-quality.yml']
  pull_request:
    branches: [main, master]
    paths: ['scripts/**', 'adapters/**', 'plugins/**/*.py']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff + bandit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - run: pip install ruff bandit

      - name: ruff (lint)
        continue-on-error: true
        run: ruff check scripts adapters

      - name: ruff (format)
        continue-on-error: true
        run: ruff format --check scripts adapters

      - name: bandit (SARIF)
        continue-on-error: true
        run: bandit -r scripts adapters -f sarif -o bandit.sarif -ll

      - name: Upload SARIF
        if: ${{ hashFiles('bandit.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: bandit.sarif
          category: bandit
