name: CI

on:
  push:
    branches: [main, master]
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', 'clippy.toml', 'scripts/**', 'adapters/**', '.github/workflows/ci.yml']
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Unit Tests
        run: cargo test --workspace --lib

  generated-artifacts:
    name: Generated artifacts in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Regenerate adapters
        run: python scripts/generate_adapters.py

      - name: Fail if committed generated output is stale
        run: git diff --exit-code -- crates/xcelerate/src/adapters bindings/python/xcelerate/adapters
