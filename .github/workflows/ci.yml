name: CI

on:
  push:
    branches: [main, master]
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', 'clippy.toml', 'scripts/**', 'adapters/**', '.github/workflows/ci.yml']
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Unit Tests
        run: cargo test --workspace --lib

  generated-artifacts:
    name: Generated artifacts in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate adapters
        run: python scripts/generate_adapters.py

      - name: Fail if committed generated output is stale
        run: git diff --exit-code -- crates/xcelerate/src/adapters bindings/python/xcelerate/adapters
