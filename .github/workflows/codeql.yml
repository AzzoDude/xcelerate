# CodeQL analysis (Advanced setup).
#
# Rust is not a CodeQL language, so the Rust core (`crates/`) is not covered.
# This workflow scans the hand-written non-Rust code that actually exists:
#
#   * python  - scripts/ and adapters/runtime.py
#   * actions - the GitHub Actions workflows in .github/workflows
#
# The generated language bindings under `bindings/` are excluded via
# .github/codeql/codeql-config.yml, and every language uses `build-mode: none`,
# so CodeQL extracts without building. The previous Default-setup run failed
# because it tried to autobuild generated Gradle projects (java-kotlin) and
# nonexistent C/C++ translation units.
#
# Requires switching the repository from CodeQL **Default setup** to
# **Advanced** (Settings -> Code security -> Code scanning); the two cannot be
# enabled at the same time.

name: CodeQL

# The repository has CodeQL **default setup** enabled, which scans the supported
# languages automatically. An advanced workflow cannot upload its SARIF while
# default setup is on ("CodeQL analyses from advanced configurations cannot be
# processed when the default setup is enabled"), so the automatic triggers below
# are disabled to keep the CI green. Default setup already covers `python` and
# `actions`, so no scanning coverage is lost.
#
# To use this workflow instead, disable default setup (Settings -> Code security
# -> Code scanning, or
# `gh api -X PATCH repos/ChaoswareHQ/xcelerate/code-scanning/default-setup -f
# state=not-configured`) and restore the push/pull_request/schedule triggers.
on:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
