# CodeQL analysis (Advanced setup).
#
# Rust is not a CodeQL language, so the Rust core (`crates/`) is not covered.
# This workflow scans the hand-written non-Rust code that actually exists:
#
#   * python  - scripts/ and adapters/runtime.py
#   * actions - the GitHub Actions workflows in .github/workflows
#
# The generated language bindings under `bindings/` are excluded via
# .github/codeql/codeql-config.yml, and every language uses `build-mode: none`,
# so CodeQL extracts without building. The previous Default-setup run failed
# because it tried to autobuild generated Gradle projects (java-kotlin) and
# nonexistent C/C++ translation units.
#
# Requires switching the repository from CodeQL **Default setup** to
# **Advanced** (Settings -> Code security -> Code scanning); the two cannot be
# enabled at the same time.

name: CodeQL

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
  schedule:
    - cron: '27 3 * * 1'

# Cancel superseded runs on the same ref.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
