# Test coverage for the Rust workspace, uploaded as an artifact (advisory).

name: Coverage

on:
  push:
    branches: [main, master]
    paths: ['crates/**', 'Cargo.*']
  pull_request:
    branches: [main, master]
    paths: ['crates/**', 'Cargo.*']

permissions:
  contents: read

jobs:
  coverage:
    name: cargo-llvm-cov
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: taiki-e/install-action@db3874b116727aa105fa89413c3552b9346f8cc9 # cargo-llvm-cov

      - name: Run tests with coverage
        run: cargo llvm-cov --workspace --lib --lcov --output-path lcov.info

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lcov
          path: lcov.info
