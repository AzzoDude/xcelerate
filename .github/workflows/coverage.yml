# Test coverage for the Rust workspace, uploaded as an artifact (advisory).

name: Coverage

on:
  push:
    branches: [main, master]
    paths: ['crates/**', 'Cargo.*']
  pull_request:
    branches: [main, master]
    paths: ['crates/**', 'Cargo.*']

permissions:
  contents: read

jobs:
  coverage:
    name: cargo-llvm-cov
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        run: cargo llvm-cov --workspace --lib --cobertura --output-path cobertura.xml

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-rust
          path: cobertura.xml

  upload-coverage-rust:
    needs: coverage
    if: ${{ !cancelled() && needs.coverage.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report-rust

      - uses: actions/upload-code-coverage@v1
        with:
          file: cobertura.xml
          language: Rust
          label: code-coverage-agent
