name: Build Packages (Core + Bindings)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['crates/**', 'bindings/**', 'scripts/**', 'Cargo.*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build-native:
    name: Build Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            lib_path: target/release/xcelerate.dll
          - os: ubuntu-latest
            lib_path: target/release/libxcelerate.so
          - os: macos-latest
            lib_path: target/release/libxcelerate.dylib
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Cache Native Library
        id: cache-native
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ matrix.lib_path }}
          key: ${{ runner.os }}-native-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**', 'build.rs') }}
      - name: Build Core
        if: steps.cache-native.outputs.cache-hit != 'true'
        run: cargo build --release
      - name: Upload Native Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-lib-${{ matrix.os }}
          path: ${{ matrix.lib_path }}

  generate-bindings:
    name: Generate Multi-Language Bindings
    needs: build-native
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: native-libs

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: 'pip'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 'stable'

      - name: Install Python Build Tooling
        # Must run unconditionally: the cargo-tools cache may be warm, but the
        # Python `build`/`wheel` modules live outside that cache and are needed
        # by the Python binding generator (`python -m build`).
        run: python -m pip install --upgrade pip build wheel

      - name: Cache Cargo Binaries
        id: cache-tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin
          # v3: forces a fresh install of the external generators so they match
          # the pinned uniffi (0.31.x); a stale cached binary produces "Unexpected
          # metadata type code" when it reads the current cdylib.
          key: ${{ runner.os }}-uniffi-tools-v3

      - name: Install Generation Tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cargo install uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag v0.11.0+v0.31.0 --force
          cargo install uniffi-bindgen-node-js --version 0.0.16 --force

      - name: Add Cargo Bin to PATH
        # `echo ... >>` writes plain newline-terminated UTF-8 (no BOM), unlike
        # Out-File which prepends a BOM and corrupts the first PATH entry.
        shell: pwsh
        run: echo "$env:USERPROFILE\.cargo\bin" >> $env:GITHUB_PATH

      - name: Organize Binaries
        shell: bash
        run: |
          mkdir -p target/release
          cp native-libs/native-lib-windows-latest/xcelerate.dll target/release/
          cp native-libs/native-lib-ubuntu-latest/libxcelerate.so target/release/
          cp native-libs/native-lib-macos-latest/libxcelerate.dylib target/release/
          mkdir -p bindings/csharp
          cp target/release/*.dll target/release/*.so target/release/*.dylib bindings/csharp/

      - name: Install JVM toolchains (Kotlin / Java)
        # Best effort: JDK 22-24 via winget, Gradle + uniffi-bindgen-java otherwise.
        # If it fails, the generator scripts still emit sources and skip packaging.
        continue-on-error: true
        run: python scripts/install_toolchains.py

      - name: Run Bindgen Scripts
        run: python scripts/generate_bindings.py
        env:
          SKIP_RUST_BUILD: "true"

      - name: Consolidate Packages
        shell: pwsh
        run: |
          mkdir -p dist-final
          Get-ChildItem -Path bindings -Filter *.whl -Recurse | Copy-Item -Destination dist-final/
          Get-ChildItem -Path bindings -Filter *.tar.gz -Recurse | Copy-Item -Destination dist-final/
          Get-ChildItem -Path bindings -Filter *.tgz -Recurse | Copy-Item -Destination dist-final/
          Get-ChildItem -Path bindings -Filter *.nupkg -Recurse | Copy-Item -Destination dist-final/
          Get-ChildItem -Path bindings -Filter *.jar -Recurse | Copy-Item -Destination dist-final/
          # Ruby / Dart / Go / Swift publish from the checked-out sources in the
          # publish workflow, so they are not collected as artifacts here.

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: language-packages
          path: dist-final/
