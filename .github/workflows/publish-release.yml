# Create the GitHub Release for the workspace version and attach the packages.
name: "Publish · GitHub Release"

on:
  workflow_call:
    inputs:
      run_id:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build Packages run ID (empty = latest successful run)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read workspace version
        id: version
        run: echo "version=$(grep -oP '^version = \"\K[^\"]+' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/download-language-packages
        with:
          run_id: ${{ inputs.run_id }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          files: dist-packages/*
          generate_release_notes: true
