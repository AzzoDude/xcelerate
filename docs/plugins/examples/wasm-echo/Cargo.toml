[package]
name = "xcelerate-plugin-wasm-echo"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: do not join the xcelerate workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.62"
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
