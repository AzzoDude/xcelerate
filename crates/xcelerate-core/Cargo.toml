[package]
name = "xcelerate-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Transport and typed command layer for xcelerate (Chrome DevTools Protocol)."

[dependencies]
browser-protocol = { workspace = true }
js-protocol = { workspace = true }
webdriver-bidi = { workspace = true }
futures = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }

[lints]
workspace = true

# `rustls` is not `use`d directly: it is pulled in so its `ring` crypto
# provider is enabled workspace-wide for the rare user-supplied `wss://`
# endpoint (feature unification with `tokio-tungstenite`). cargo-machete can't
# see that, so keep it explicitly.
[package.metadata.cargo-machete]
ignored = ["rustls"]
