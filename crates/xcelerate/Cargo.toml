[package]
name = "xcelerate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A high-performance, lightweight Chrome DevTools Protocol (CDP) client for Rust."
documentation = "https://docs.rs/xcelerate"
keywords = ["automation", "cdp", "chrome", "headless", "stealth"]
categories = ["web-programming", "development-tools"]
readme = "../../README.md"

[lib]
name = "xcelerate"
crate-type = ["rlib", "cdylib"]

[features]
default = ["wasm"]
# The WebAssembly (Component Model) plugin transport. Sandboxed by construction.
wasm = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:rmp-serde"]

[dependencies]
xcelerate-core = { workspace = true }
xcelerate-plugin-api = { workspace = true }
xcelerate-plugins = { workspace = true }
browser-protocol = { workspace = true }
js-protocol = { workspace = true }
uniffi = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }

wasmtime = { version = "49", optional = true, default-features = false, features = [
    # Everything below is required by this transport or by wasmtime-wasi's
    # preview-2 host: the component model compiled ahead of time by Cranelift and
    # driven through the synchronous API. `async` is pulled in by wasmtime-wasi.
    "async",
    "component-model",
    "cranelift",
    "runtime",
    "std",
] }
# `p2` is the only WASI surface the plugins target (see `plugin/wasm.rs`); the
# default `p1`/`p3` pull in the preview-1 wiggle shim and async-only interfaces.
wasmtime-wasi = { version = "49", optional = true, default-features = false, features = ["p2"] }
rmp-serde = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
