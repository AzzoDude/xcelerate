[package]
name = "xcelerate-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for the xcelerate engine."
publish = false

[[bin]]
name = "xcelerate"
path = "src/main.rs"

[dependencies]
xcelerate.workspace = true
xcelerate-interpreter.workspace = true
xcelerate-mcp.workspace = true
xcelerate-codegen.workspace = true
clap.workspace = true
tokio.workspace = true
mimalloc.workspace = true
serde_json.workspace = true

[features]
# Opt in to the interpreter's in-process HTTPS client (the XCL `request` op).
# Off by default so default builds stay dependency-light. The client lives in
# `xcelerate-interpreter`; the CLI only forwards this feature.
http = ["xcelerate-interpreter/http"]

[lints]
workspace = true
