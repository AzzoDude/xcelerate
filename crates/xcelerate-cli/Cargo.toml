[package]
name = "xcelerate-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for the xcelerate CDP engine."
publish = false

[[bin]]
name = "xcelerate"
path = "src/main.rs"

[dependencies]
xcelerate.workspace = true
xcelerate-mcp.workspace = true
xcelerate-ui = { workspace = true, optional = true }
clap.workspace = true
tokio.workspace = true
mimalloc.workspace = true
serde_json.workspace = true

[features]
default = ["ui"]
# The native overlay window (winit + egui). Build with `--no-default-features`
# to drop the GUI stack; the overlay then becomes a no-op.
ui = ["dep:xcelerate-ui"]

[lints]
workspace = true
