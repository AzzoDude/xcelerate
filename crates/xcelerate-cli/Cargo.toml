[package]
name = "xcelerate-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for the xcelerate CDP engine."
publish = false

[[bin]]
name = "xcelerate"
path = "src/main.rs"

[dependencies]
xcelerate.workspace = true
xcelerate-mcp.workspace = true
xcelerate-codegen.workspace = true
clap.workspace = true
tokio.workspace = true
mimalloc.workspace = true
serde_json.workspace = true
futures = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[features]
# Opt in to an in-process HTTPS client for `fetch` / `fetch-to`. Off by default
# so default builds stay dependency-light; the core crate is never affected.
http = ["dep:reqwest", "dep:futures"]

[lints]
workspace = true
