name: xcelerate_examples
description: Runnable Dart examples for the xcelerate Chrome DevTools Protocol bindings.
publish_to: none
version: 1.0.10

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  # Published binding: https://pub.dev/packages/xcelerate
  xcelerate: ^1.0.10

dependency_overrides:
  # 1.0.9 on pub.dev could not start a browser (wrong UniFFI ABI and a stubbed
  # `Browser.launch`). The fixed binding is generated in this repository; delete
  # this override once 1.0.10 is published.
  xcelerate:
    path: ../../bindings/dart
